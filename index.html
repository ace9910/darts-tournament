<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トーナメント</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    /* White-based palette with red / black / blue accents. */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --ink: #101113;
    --ink-soft: #4B4F58;
    --ink-faint: #8B909B;
    --accent: #D6262C;
    --accent-strong: #AD1C22;
    --accent-ink: #FFFFFF;
    --blue: #1857B0;
    --blue-soft: #E6EFFB;
    --red: #C81E2A;
    --red-soft: #FBE8E9;
    --line: #E2E4E9;
    --shadow: 0 1px 0 rgba(16,17,19,0.05), 0 8px 20px -14px rgba(16,17,19,0.25);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0C0E;
      --surface: #17181B;
      --surface-2: #212327;
      --ink: #F4F5F7;
      --ink-soft: #C2C5CC;
      --ink-faint: #858993;
      --accent: #FF4D53;
      --accent-strong: #FF7A7F;
      --accent-ink: #1A0304;
      --blue: #5B9BF0;
      --blue-soft: #1B2A3E;
      --red: #FF6B6F;
      --red-soft: #3A1518;
      --line: #2C2E33;
      --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 12px 28px -16px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0B0C0E;
    --surface: #17181B;
    --surface-2: #212327;
    --ink: #F4F5F7;
    --ink-soft: #C2C5CC;
    --ink-faint: #858993;
    --accent: #FF4D53;
    --accent-strong: #FF7A7F;
    --accent-ink: #1A0304;
    --blue: #5B9BF0;
    --blue-soft: #1B2A3E;
    --red: #FF6B6F;
    --red-soft: #3A1518;
    --line: #2C2E33;
    --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 12px 28px -16px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: "Big Shoulders Display", "Archivo", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    text-wrap: balance;
    font-weight: 700;
    color: var(--ink);
  }

  .mono, .tabular, .score-num, .rank-num {
    font-family: "Space Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  a { color: var(--accent-strong); }

  button, select {
    font-family: inherit;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Header ---------- */
  .header {
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 20px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-icon {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, var(--red) 0 14%, var(--surface) 14% 16%, var(--blue) 16% 30%, var(--surface) 30% 33%, var(--ink) 33% 48%, var(--surface) 48% 100%);
    border: 2px solid var(--accent);
    box-shadow: var(--shadow);
  }
  .brand-text h1 { font-size: 22px; margin: 0; line-height: 1.1; }
  .brand-text p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .new-room-link {
    display: block;
    margin: 4px 0 0;
    padding: 0;
    background: none;
    border: none;
    font-size: 11px;
    color: var(--ink-faint);
    text-decoration: underline;
    cursor: pointer;
  }
  .role-toggle {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .role-toggle button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 11.5px;
    padding: 6px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .role-toggle button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .readonly-banner {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 20px;
    font-size: 13px;
    background: var(--surface-2);
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
  }

  /* ---------- Layout ---------- */
  .container { max-width: 720px; margin: 0 auto; padding: 20px 20px 80px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 16px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }

  /* ---------- Top-level nav (ロビン表一覧 / 履歴) ---------- */
  .top-nav {
    display: flex; gap: 6px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .top-nav .tab { font-size: 15px; }

  /* ---------- Setup ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input[type="text"], .field select, select.field-select {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    width: 100%;
  }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-row .member-inputs { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .add-row input { flex: 1; min-width: 96px; }
  .add-row input.rating-input { flex: 0 0 90px; min-width: 70px; }
  .player-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .player-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 6px 6px 12px;
    font-size: 14px;
  }
  .player-chip button {
    background: none; border: none; color: var(--ink-faint);
    font-size: 15px; line-height: 1; padding: 2px 4px;
  }
  .player-chip button:hover { color: var(--red); }
  .rt-badge { font-size: 11px; color: var(--ink-faint); font-weight: 700; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stepper {
    display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
  }
  .stepper button {
    border: none; background: var(--surface-2); color: var(--ink);
    width: 34px; height: 34px; font-size: 16px; font-weight: 700;
  }
  .stepper output {
    min-width: 36px; text-align: center; font-size: 15px; font-weight: 600;
  }

  /* ---------- Format segmented control ---------- */
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft);
    padding: 10px 8px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .format-badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-soft);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 9px; border: 1px solid transparent;
    padding: 11px 18px; font-size: 14.5px; font-weight: 600;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 7px; }
  .btn-block { width: 100%; }

  /* ---------- Tabs (sub-tabs within a table) ---------- */
  .tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: none; border: none; padding: 10px 4px; margin-right: 18px;
    font-size: 14px; font-weight: 600; color: var(--ink-faint);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* ---------- Table list ---------- */
  .table-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .table-card {
    border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .table-card .t-info h3 { margin: 0 0 5px; font-size: 17px; }
  .table-card .t-info .meta { font-size: 12px; color: var(--ink-faint); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .table-card .progress { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

  /* ---------- Table detail header ---------- */
  .t-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 10px 0 12px; }
  .t-head h2 { font-size: 24px; margin: 0 0 4px; }
  .t-meta { font-size: 12.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .t-meta span { display: inline-flex; align-items: center; gap: 4px; }

  /* ---------- Leg config panel ---------- */
  .leg-panel {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  }
  .leg-panel .leg-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .leg-summary-text { color: var(--ink-soft); }
  .leg-summary-text b { color: var(--ink); font-weight: 700; }
  .leg-edit-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .leg-row { display: flex; align-items: center; gap: 10px; }
  .leg-row .leg-num { width: 56px; flex-shrink: 0; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
  .leg-row select { flex: 1; }

  /* ---------- Handicap panel ---------- */
  .handicap-panel { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .handicap-group-label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .handicap-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .handicap-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 52px; flex-shrink: 0; }
  .handicap-cell-label { font-size: 11px; color: var(--ink-faint); font-weight: 600; }
  .handicap-input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 7px; padding: 6px 4px; font-size: 13px; text-align: center;
  }
  .handicap-value { font-size: 13.5px; font-weight: 600; }

  /* ---------- Board strip ---------- */
  .board-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .board-chip {
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px;
    border: 1px solid var(--line); min-width: 108px;
  }
  .board-chip .label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 2px; }
  .board-chip.free { background: var(--surface); color: var(--ink-soft); }
  .board-chip.busy { background: var(--blue-soft); border-color: var(--blue); color: var(--ink); font-weight: 600; }

  /* ---------- Match cards ---------- */
  .match-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .match-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .match-players { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .player-name { font-size: 15.5px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: break-word; }
  .player-name.winner { color: var(--accent-strong); }
  .result-mark { display: inline-block; font-weight: 700; font-size: 13px; line-height: 1; margin-right: 3px; }
  .result-mark.mark-win { color: var(--accent-strong); }
  .result-mark.mark-lose { color: var(--red); }
  .vs-dot {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle, var(--red) 0 30%, var(--surface-2) 30% 55%, var(--blue) 55% 78%, var(--surface-2) 78% 100%);
    border: 1px solid var(--line);
  }
  .match-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .status-pill {
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap;
  }
  .status-pill.pending { background: var(--surface-2); color: var(--ink-faint); }
  .status-pill.in_progress { background: var(--accent); color: var(--accent-ink); }
  .status-pill.done { background: var(--blue-soft); color: var(--blue); }
  .match-score { font-size: 13px; color: var(--ink-soft); }
  .match-body { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .match-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .score-row { display: flex; align-items: center; gap: 10px; }
  .score-row .name { font-size: 13.5px; width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-select {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 7px; padding: 6px 8px; font-size: 13px;
  }
  .match-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* ---------- Cross table (総当たり表) ---------- */
  .ct-wrap { margin-bottom: 18px; }
  .ct-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ct-header-bar { width: 5px; align-self: stretch; min-height: 22px; background: var(--red); border-radius: 3px; flex-shrink: 0; }
  .ct-title { margin: 0; font-size: 17px; letter-spacing: 0; text-transform: none; }
  .ct-table { border-collapse: collapse; width: 100%; }
  .ct-table th, .ct-table td {
    border: 1px solid var(--line);
    text-align: center;
    padding: 0;
  }
  .ct-corner { background: var(--surface-2); min-width: 44px; }
  .ct-colnum {
    min-width: 76px; padding: 8px 4px !important; font-size: 13.5px; font-weight: 700;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .ct-stat-h {
    width: 38px; padding: 4px 2px !important; font-size: 9.5px; line-height: 1.25; font-weight: 700; color: var(--ink-faint);
    background: var(--surface-2); letter-spacing: 0;
  }
  .ct-rowlabel {
    padding: 6px 10px !important; text-align: left !important; white-space: nowrap;
    background: var(--surface-2); font-weight: 600; font-size: 13px;
  }
  .ct-rownum { display: inline-block; min-width: 16px; font-weight: 700; color: var(--ink); margin-right: 6px; }
  .ct-rowname { color: var(--ink-soft); font-weight: 500; }
  .ct-cell { width: 76px; height: 40px; position: relative; background: var(--surface); }
  .ct-cell.diag {
    background: repeating-linear-gradient(45deg, transparent 0, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px), transparent 100%);
  }
  .ct-cell.hatched {
    background:
      repeating-linear-gradient(45deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 7px);
    opacity: 0.55;
  }
  .ct-cell.fillable.live { background: var(--surface-2); }
  .ct-cell.fillable.done { background: var(--blue-soft); }
  .ct-cell-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; height: 40px; border: none; background: none;
    font-size: 11.5px; color: var(--ink-soft); padding: 0 2px; white-space: nowrap;
  }
  .ct-cell.done .ct-cell-btn { color: var(--blue); font-weight: 700; }
  .ct-cell.fillable:not(.done):hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ct-cell span.mono {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; height: 40px; font-size: 11.5px; color: var(--ink-faint); white-space: nowrap;
  }
  .ct-cell.ct-mirror { opacity: 0.82; }
  .ct-cell.ct-mirror .ct-cell-btn, .ct-cell.ct-mirror span.mono { color: var(--ink-faint); }
  .ct-stat { width: 38px; padding: 6px 2px !important; font-size: 12.5px; }
  .ct-rank { font-weight: 700; }
  .ct-editor { margin-top: 14px; }
  .ct-legend {
    margin-top: 10px; display: flex; align-items: flex-start; gap: 10px;
    font-size: 12.5px; color: var(--ink-soft);
  }
  .ct-legend-tag {
    flex-shrink: 0; background: var(--red); color: #fff; font-weight: 700;
    font-size: 11px; padding: 4px 10px; border-radius: 5px; letter-spacing: 0.02em; margin-top: 1px;
  }
  .ct-legend-list {
    flex: 1; min-width: 0; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 6px 4px;
  }
  .ct-legend-item { white-space: nowrap; }
  .ct-legend-item b { color: var(--ink); font-family: "Space Mono", ui-monospace, monospace; }

  /* ---------- Standings ---------- */
  .standings-table { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; }
  .standings-table th, .standings-table td {
    padding: 10px 8px; font-size: 13.5px; text-align: left; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .standings-table th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 600;
  }
  .standings-table td.num, .standings-table th.num { text-align: right; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .rank-badge.r1 { background: var(--accent); color: var(--accent-ink); }
  .rank-badge.r2 { background: #C6C0AC; color: #2A2618; }
  .rank-badge.r3 { background: #C89464; color: #2A1B0E; }

  /* ---------- History ---------- */
  .history-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); }
  .history-item summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .history-item summary::-webkit-details-marker { display: none; }
  .history-item h3 { font-size: 16px; margin: 0 0 4px; }
  .history-item .h-date { font-size: 12px; color: var(--ink-faint); }
  .history-item .h-winner { font-size: 13px; color: var(--accent-strong); font-weight: 600; }
  .history-standings { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .history-actions { margin-top: 10px; }

  /* ---------- Misc ---------- */
  .empty-state { text-align: center; padding: 36px 16px; color: var(--ink-soft); }
  .empty-state .icon { font-size: 30px; margin-bottom: 10px; }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 700; margin: 24px 0 10px; }
  .divider { border: none; border-top: 1px solid var(--line); margin: 20px 0; }

  /* ---------- Tournament bracket ---------- */
  .trn-source-list { display: flex; flex-direction: column; gap: 8px; }
  .trn-source-row {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px;
  }
  .trn-source-row.checked { background: var(--blue-soft); border-color: var(--blue); }
  .trn-source-check { font-size: 18px; flex-shrink: 0; }
  .trn-source-info { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
  .trn-source-info b { font-weight: 600; }
  .trn-manual-list { display: flex; flex-direction: column; gap: 8px; }
  .trn-manual-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px;
  }
  .trn-manual-row.dup { border-color: var(--red); background: rgba(220, 38, 38, 0.08); }
  .trn-manual-name { font-size: 14px; font-weight: 600; display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
  .field select.trn-manual-select {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 6px 8px; font-size: 14px; min-width: 56px; width: auto; flex: 0 0 auto;
  }
  .trn-section { margin-bottom: 18px; }
  .trn-seed-tag { font-size: 10.5px; color: var(--ink-faint); }
  .bracket-diagram-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px 18px; padding: 6px 16px 18px; min-height: 60px; }
  .bracket-diagram { display: grid; width: max-content; column-gap: 20px; }
  .bracket-round-title { grid-row: 1; align-self: end; text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-faint); margin-bottom: 6px; letter-spacing: 0.02em; white-space: nowrap; }
  .bracket-match-slot { display: flex; flex-direction: column; justify-content: center; position: relative; padding-right: 20px; }
  .bracket-team-box {
    border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
    padding: 5px 8px; font-size: 12px; line-height: 1.3; margin: 2px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 108px;
  }
  .bracket-team-box.winner { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent-strong); font-weight: 700; }
  .bracket-team-box.pending { color: var(--ink-faint); font-style: italic; border-style: dashed; }
  .bracket-match-slot.conn-top::after {
    content: ""; position: absolute; top: 50%; bottom: 0; right: 2px; width: 18px;
    border-top: 2px solid var(--line); border-right: 2px solid var(--line);
  }
  .bracket-match-slot.conn-bottom::after {
    content: ""; position: absolute; top: 0; bottom: 50%; right: 2px; width: 18px;
    border-bottom: 2px solid var(--line); border-right: 2px solid var(--line);
  }
  .bracket-match-slot.conn-final::after {
    content: ""; position: absolute; top: 50%; right: 2px; width: 18px; height: 0; border-top: 2px solid var(--line);
  }
  .bracket-champion-col { display: flex; flex-direction: column; justify-content: center; padding-left: 6px; min-width: 110px; }
  .bracket-champion-box {
    border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent-strong);
    border-radius: 8px; padding: 10px 14px; font-weight: 800; font-size: 13px; text-align: center; white-space: nowrap;
  }
  .bracket-champion-box.pending { border-style: dashed; background: transparent; color: var(--ink-faint); font-weight: 600; }

  /* ---------- Password gate / QR share panel ---------- */
  .password-banner { display: flex; flex-direction: column; gap: 8px; }
  .password-label { font-weight: 600; color: var(--ink); }
  .password-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .password-input {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font-size: 15px; width: 120px;
    letter-spacing: 0.12em;
  }
  .password-error { color: var(--red); font-size: 12.5px; font-weight: 600; width: 100%; }
  .qr-panel { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .qr-caption { margin: 0; font-size: 12.5px; color: var(--ink-soft); max-width: 320px; }
  .qr-code-box { background: #fff; padding: 10px; border-radius: 10px; width: 132px; box-shadow: var(--shadow); }
  .qr-code-box svg { display: block; width: 100%; height: auto; }
  .qr-url { margin: 0; font-size: 11px; color: var(--ink-faint); word-break: break-all; max-width: 280px; }

  .toast-wrap {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: 100%; padding: 0 16px;
  }
  .toast {
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 13.5px;
    box-shadow: var(--shadow); max-width: 420px; text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 480px) {
    .row-2 { grid-template-columns: 1fr; }
    .brand-text h1 { font-size: 19px; }
    .score-row .name { width: 68px; }
    .table-card { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>トーナメント</h1>
          <p>ラウンドロビン式ハウストーナメント盤</p>
          <button type="button" class="new-room-link" id="new-room-link" data-action="new-tournament-room">＋ 新しい大会を始める</button>
        </div>
      </div>
      <div class="role-toggle" id="role-toggle" role="group" aria-label="表示モード"></div>
    </div>
  </header>
  <div id="readonly-banner"></div>
  <main class="container" id="root"></main>
</div>

    padding: 14px 16px; margin-bottom: 10px;
  }
  .match-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .match-players { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .player-name { font-size: 15.5px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: break-word; }
  .player-name.winner { color: var(--accent-strong); }
  .result-mark { display: inline-block; font-weight: 700; font-size: 13px; line-height: 1; margin-right: 3px; }
  .result-mark.mark-win { color: var(--accent-strong); }
  .result-mark.mark-lose { color: var(--red); }
  .vs-dot {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle, var(--red) 0 30%, var(--surface-2) 30% 55%, var(--blue) 55% 78%, var(--surface-2) 78% 100%);
    border: 1px solid var(--line);
  }
  .match-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .status-pill {
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap;
  }
  .status-pill.pending { background: var(--surface-2); color: var(--ink-faint); }
  .status-pill.in_progress { background: var(--accent); color: var(--accent-ink); }
  .status-pill.done { background: var(--blue-soft); color: var(--blue); }
  .match-score { font-size: 13px; color: var(--ink-soft); }
  .match-body { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .match-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .score-row { display: flex; align-items: center; gap: 10px; }
  .score-row .name { font-size: 13.5px; width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-select {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 7px; padding: 6px 8px; font-size: 13px;
  }
  .match-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* ---------- Cross table (総当たり表) ---------- */
  .ct-wrap { margin-bottom: 18px; }
  .ct-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ct-header-bar { width: 5px; align-self: stretch; min-height: 22px; background: var(--red); border-radius: 3px; flex-shrink: 0; }
  .ct-title { margin: 0; font-size: 17px; letter-spacing: 0; text-transform: none; }
  .ct-table { border-collapse: collapse; width: 100%; }
  .ct-table th, .ct-table td {
    border: 1px solid var(--line);
    text-align: center;
    padding: 0;
  }
  .ct-corner { background: var(--surface-2); min-width: 44px; }
  .ct-colnum {
    min-width: 76px; padding: 8px 4px !important; font-size: 13.5px; font-weight: 700;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .ct-stat-h {
    width: 38px; padding: 4px 2px !important; font-size: 9.5px; line-height: 1.25; font-weight: 700; color: var(--ink-faint);
    background: var(--surface-2); letter-spacing: 0;
  }
  .ct-rowlabel {
    padding: 6px 10px !important; text-align: left !important; white-space: nowrap;
    background: var(--surface-2); font-weight: 600; font-size: 13px;
  }
  .ct-rownum { display: inline-block; min-width: 16px; font-weight: 700; color: var(--ink); margin-right: 6px; }
  .ct-rowname { color: var(--ink-soft); font-weight: 500; }
  .ct-cell { width: 76px; height: 40px; position: relative; background: var(--surface); }
  .ct-cell.diag {
    background: repeating-linear-gradient(45deg, transparent 0, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px), transparent 100%);
  }
  .ct-cell.hatched {
    background:
      repeating-linear-gradient(45deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 7px);
    opacity: 0.55;
  }
  .ct-cell.fillable.live { background: var(--surface-2); }
  .ct-cell.fillable.done { background: var(--blue-soft); }
  .ct-cell-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; height: 40px; border: none; background: none;
    font-size: 11.5px; color: var(--ink-soft); padding: 0 2px; white-space: nowrap;
  }
  .ct-cell.done .ct-cell-btn { color: var(--blue); font-weight: 700; }
  .ct-cell.fillable:not(.done):hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ct-cell span.mono {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; height: 40px; font-size: 11.5px; color: var(--ink-faint); white-space: nowrap;
  }
  .ct-cell.ct-mirror { opacity: 0.82; }
  .ct-cell.ct-mirror .ct-cell-btn, .ct-cell.ct-mirror span.mono { color: var(--ink-faint); }
  .ct-stat { width: 38px; padding: 6px 2px !important; font-size: 12.5px; }
  .ct-rank { font-weight: 700; }
  .ct-editor { margin-top: 14px; }
  .ct-legend {
    margin-top: 10px; display: flex; align-items: flex-start; gap: 10px;
    font-size: 12.5px; color: var(--ink-soft);
  }
  .ct-legend-tag {
    flex-shrink: 0; background: var(--red); color: #fff; font-weight: 700;
    font-size: 11px; padding: 4px 10px; border-radius: 5px; letter-spacing: 0.02em; margin-top: 1px;
  }
  .ct-legend-list {
    flex: 1; min-width: 0; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 6px 4px;
  }
  .ct-legend-item { white-space: nowrap; }
  .ct-legend-item b { color: var(--ink); font-family: "Space Mono", ui-monospace, monospace; }

  /* ---------- Standings ---------- */
  .standings-table { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; }
  .standings-table th, .standings-table td {
    padding: 10px 8px; font-size: 13.5px; text-align: left; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .standings-table th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 600;
  }
  .standings-table td.num, .standings-table th.num { text-align: right; }
  .rank-badge {

  }
  .rank-badge.r1 { background: var(--accent); color: var(--accent-ink); }
  .rank-badge.r2 { background: #C6C0AC; color: #2A2618; }
  .rank-badge.r3 { background: #C89464; color: #2A1B0E; }

  /* ---------- History ---------- */
  .history-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); }

  .history-item h3 { font-size: 16px; margin: 0 0 4px; }
  .history-item .h-date { font-size: 12px; color: var(--ink-faint); }
  .history-item .h-winner { font-size: 13px; color: var(--accent-strong); font-weight: 600; }

  .history-actions { margin-top: 10px; }

  .muted { color: var(--ink-soft); font-size: 13px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 700; margin: 24px 0 10px; }
  .divider { border: none; border-top: 1px solid var(--line); margin: 20px 0; }

  .trn-source-list { display: flex; flex-direction: column; gap: 8px; }
  .trn-source-row {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px;
  }
  .trn-source-row.checked { background: var(--blue-soft); border-color: var(--blue); }

  }
  .trn-manual-row.dup { border-color: var(--red); background: rgba(220, 38, 38, 0.08); }

  .field select.trn-manual-select {

  }
  .trn-section { margin-bottom: 18px; }
  .trn-seed-tag { font-size: 10.5px; color: var(--ink-faint); }

  .bracket-diagram { display: grid; width: max-content; column-gap: 20px; }
  .bracket-round-title { grid-row: 1; align-self: end; text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-faint); margin-bottom: 6px; letter-spacing: 0.02em; white-space: nowrap; }

    padding: 5px 8px; font-size: 12px; line-height: 1.3; margin: 2px 0;

  }

  .password-banner { display: flex; flex-direction: column; gap: 8px; }

      var FIVE_ORDER = [[0, 1], [2, 3], [0, 4], [1, 2], [3, 4], [0, 2], [1, 3], [2, 4], [0, 3], [1, 4]];

      FIVE_ORDER.forEach(function (pair, idx) {
        var pa = entrants[pair[0]], pb = entrants[pair[1]];
        fiveMatches.push({
          id: uid("m"),
          round: idx,
          order: idx,
          board: (idx % boardCount) + 1,
          playerAId: pa.id,
          playerAName: pa.name,
          playerBId: pb.id,
          playerBName: pb.name,
          status: "pending",
          scoreA: 0,
          scoreB: 0,
          winnerId: null
        });
      });
      return fiveMatches;
    }
    // 6-entrant tables use the "cross robin" format common on printed dart
    // group sheets: instead of the full round robin (5 rounds / 15 matches),
    // the round that pairs each entrant with their round-robin "opposite"
    // (position i vs position n-1-i in the initial order) is skipped,
    // leaving 4 rounds / 12 matches. With the fixed-position circle method
    // below, that opposite-pairing round is always the very first one
    // (r === 0, before any rotation), so it's simply omitted.
    var skipOpposite = entrants.length === 6;
    var list = entrants.slice();
    if (list.length % 2 !== 0) list.push({ id: "__bye__", name: "BYE" });
    var n = list.length;
    var half = n / 2;
    var arr = list.slice();
    var matches = [];
    var order = 0;
    var roundNum = 0;
    for (var r = 0; r < n - 1; r++) {
      var roundMatches = [];
      for (var i = 0; i < half; i++) {
        var a = arr[i], b = arr[n - 1 - i];
        if (a.id !== "__bye__" && b.id !== "__bye__") roundMatches.push([a, b]);
      }
      if (!(skipOpposite && r === 0)) {
        roundNum++;
        for (var m = 0; m < roundMatches.length; m++) {
          var pair = roundMatches[m];
          matches.push({
            id: uid("m"),
            round: roundNum,
            order: order++,
            board: (m % boardCount) + 1,
            playerAId: pair[0].id,
            playerAName: pair[0].name,
            playerBId: pair[1].id,
            playerBName: pair[1].name,
            status: "pending",
            scoreA: 0,
            scoreB: 0,
            winnerId: null
          });
        }
      }
      var fixed = arr[0];
      var rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr = [fixed].concat(rest);
    }
    return matches;
  }

  /* ============ Tournament bracket engine ============ */
  function nextPow2(n) {
    var p = 1;
    while (p < n) p *= 2;
    return p;
  }

  // Standard single-elimination seeding order: for a bracket of size n
  // (a power of 2), returns the seed numbers in bracket-slot order so that
  // seed 1 and seed 2 can only meet in the final, seeds 1-4 can only meet
  // from the semifinal on, etc. (e.g. n=8 -> [1,8,4,5,2,7,3,6]).
  function seedOrder(n) {
    var seeds = [1, 2];
    while (seeds.length < n) {
      var size = seeds.length * 2;
      var next = [];
      seeds.forEach(function (s) {
        next.push(s);
        next.push(size + 1 - s);
      });
      seeds = next;
    }
    return seeds;
  }

  function roundLabel(totalRounds, r) {
    var fromEnd = totalRounds - 1 - r;
    if (fromEnd === 0) return "決勝";
    if (fromEnd === 1) return "準決勝";
    if (fromEnd === 2) return "準々決勝";
    return (r + 1) + "回戦";
  }

  function buildBracketSeeds(entries, advanceCount) {
    // entries: finished ロビン (state.history) entries to draw from.
    // Seeds are ordered rank-tier by rank-tier (all group winners first,
    // then all runners-up, ...) so the standard seedOrder() bracket keeps
    // same-group entrants apart for as long as possible.
    // id is deterministic (tableId + rank) rather than uid()-random so that
    // manual-placement UI can recompute this list on every render (to stay
    // live as ロビン results change) without losing in-progress position
    // assignments keyed by this id.
    var seeds = [];
    for (var rank = 0; rank < advanceCount; rank++) {
      entries.forEach(function (t) {
        var fs = t.finalStandings || [];
        if (fs[rank]) {
          seeds.push({
            id: t.id + "_r" + rank,
            name: fs[rank].name,
            rating: fs[rank].rating != null ? fs[rank].rating : null,
            source: { tableName: t.name, rank: rank + 1 }
          });
        }
      });
    }
    return seeds;
  }

  function emptyBracketMatch(round, index) {
    return {
      id: uid("tm"),
      round: round,
      index: index,
      playerAId: null, playerAName: null, playerARating: null, playerASource: null,
      playerBId: null, playerBName: null, playerBRating: null, playerBSource: null,
      status: "pending",
      scoreA: 0,
      scoreB: 0,
      winnerId: null,
      winnerName: null,
      bye: false
    };
  }

  function buildBracketRoundsFromSlots(slots) {
    // slots: array (length = a power of 2) of seed objects (or null for a
    // bye) already arranged in final bracket-position order.
    var size = slots.length;
    var totalRounds = Math.log2(size);
    var rounds = [];
    var round0 = [];
    for (var i = 0; i < size; i += 2) {
      var a = slots[i], b = slots[i + 1];
      var m = emptyBracketMatch(0, round0.length);
      m.playerAId = a ? a.id : null;
      m.playerAName = a ? a.name : null;
      m.playerARating = a ? a.rating : null;
      m.playerASource = a ? a.source : null;
      m.playerBId = b ? b.id : null;
      m.playerBName = b ? b.name : null;
      m.playerBRating = b ? b.rating : null;
      m.playerBSource = b ? b.source : null;
      m.bye = !a || !b;
      round0.push(m);
    }
    rounds.push(round0);
    for (var r = 1; r < totalRounds; r++) {
      var count = size / Math.pow(2, r + 1);
      var round = [];
      for (var j = 0; j < count; j++) round.push(emptyBracketMatch(r, j));
      rounds.push(round);
    }
    // Resolve any round-0 byes immediately (cascades forward on its own).
    rounds[0].forEach(function (m) { resolveIfBye(rounds, m); });
    return rounds;
  }

  function slotsFromSeedOrder(seeds) {
    // Standard tournament seeding: seed 1 and seed 2 land at opposite ends
    // of the bracket and can only meet in the final, seed 3/4 next, etc.
    var total = seeds.length;
    var size = nextPow2(total);
    var order = seedOrder(size);
    var slots = new Array(size);
    for (var i = 0; i < size; i++) {
      var seedNum = order[i];
      slots[i] = seedNum <= total ? seeds[seedNum - 1] : null;
    }
    return slots;
  }

  function buildBracketRounds(seeds) {
    return buildBracketRoundsFromSlots(slotsFromSeedOrder(seeds));
  }

  function buildManualSlots(seeds, positions, size) {
    // positions: { [seed.id]: 1-based slot number }. Any seed left
    // unassigned (or assigned out of range) is simply omitted (leaves that
    // slot a bye) — callers validate completeness before using this.
    var slots = new Array(size).fill(null);
    seeds.forEach(function (s) {
      var pos = positions[s.id];
      if (pos >= 1 && pos <= size && !slots[pos - 1]) slots[pos - 1] = s;
    });
    return slots;
  }

  function resolveIfBye(rounds, m) {
    if (m.status === "done") return;
    var hasA = !!m.playerAId, hasB = !!m.playerBId;
    if (m.bye && hasA && !hasB) finishBracketMatch(rounds, m, "A");
    else if (m.bye && hasB && !hasA) finishBracketMatch(rounds, m, "B");
  }

  function finishBracketMatch(rounds, m, winnerSide) {
    m.status = "done";
    var wId = winnerSide === "A" ? m.playerAId : m.playerBId;
    var wName = winnerSide === "A" ? m.playerAName : m.playerBName;
    var wRating = winnerSide === "A" ? m.playerARating : m.playerBRating;
    var wSource = winnerSide === "A" ? m.playerASource : m.playerBSource;
    m.winnerId = wId;
    m.winnerName = wName;
    var nextRound = rounds[m.round + 1];
    if (!nextRound) return;
    var next = nextRound[Math.floor(m.index / 2)];
    if (!next) return;
    if (m.index % 2 === 0) {
      next.playerAId = wId; next.playerAName = wName; next.playerARating = wRating; next.playerASource = wSource;
    } else {
      next.playerBId = wId; next.playerBName = wName; next.playerBRating = wRating; next.playerBSource = wSource;
    }
    resolveIfBye(rounds, next);
  }

  function resetBracketFrom(rounds, roundIdx, matchIdx) {
    // Clears one match's result and cascades the reset forward: whatever
    // later match this one fed into loses that player slot, and if that
    // later match had itself already been decided, its own result and
    // downstream propagation are cleared too, recursively to the final.
    var m = rounds[roundIdx][matchIdx];
    m.status = "pending";
    m.scoreA = 0; m.scoreB = 0; m.winnerId = null; m.winnerName = null;
    var nextRound = rounds[roundIdx + 1];
    if (!nextRound) return;
    var next = nextRound[Math.floor(matchIdx / 2)];
    if (!next) return;
    var hadResult = next.status === "done";
    if (matchIdx % 2 === 0) {
      next.playerAId = null; next.playerAName = null; next.playerARating = null; next.playerASource = null;
    } else {
      next.playerBId = null; next.playerBName = null; next.playerBRating = null; next.playerBSource = null;
    }
    if (hadResult) resetBracketFrom(rounds, roundIdx + 1, Math.floor(matchIdx / 2));
  }

  function findBracketMatchLocation(rounds, id) {
    for (var r = 0; r < rounds.length; r++) {
      for (var i = 0; i < rounds[r].length; i++) {
        if (rounds[r][i].id === id) return { round: r, index: i };
      }
    }
    return null;
  }

  /* ============ Rating (Rt.) helper ============ */
  function ratingBadgeHtml(rating) {
    return rating != null ? ' <span class="rt-badge">Rt.' + esc(rating) + "</span>" : "";
  }

  function resultMarkHtml(isWin) {
    return isWin
      ? '<span class="result-mark mark-win" aria-label="勝ち">○</span>'
      : '<span class="result-mark mark-lose" aria-label="負け">✕</span>';
  }

  /* ============ Standings ============ */
  function computeStandings(entrants, matches) {
    var byId = {};
    entrants.forEach(function (p) {
      byId[p.id] = { id: p.id, name: p.name, rating: p.rating != null ? p.rating : null, played: 0, wins: 0, losses: 0, legsFor: 0, legsAgainst: 0 };
    });
    matches.forEach(function (m) {
      if (m.status !== "done") return;
      var a = byId[m.playerAId], b = byId[m.playerBId];
      if (!a || !b) return;
      a.played++; b.played++;
      a.legsFor += m.scoreA; a.legsAgainst += m.scoreB;
      b.legsFor += m.scoreB; b.legsAgainst += m.scoreA;
      if (m.scoreA > m.scoreB) { a.wins++; b.losses++; }
      else if (m.scoreB > m.scoreA) { b.wins++; a.losses++; }
    });
    var rows = Object.keys(byId).map(function (k) { return byId[k]; });
    rows.sort(function (x, y) {
      if (y.wins !== x.wins) return y.wins - x.wins;
      var dx = x.legsFor - x.legsAgainst, dy = y.legsFor - y.legsAgainst;
      if (dy !== dx) return dy - dx;
      if (y.legsFor !== x.legsFor) return y.legsFor - x.legsFor;
      return x.name.localeCompare(y.name, "ja");
    });
    return rows;
  }

  function computeLifetime(history) {
    var byName = {};
    history.forEach(function (t) {
      (t.finalStandings || []).forEach(function (s) {
        if (!byName[s.name]) byName[s.name] = { name: s.name, events: 0, wins: 0, losses: 0 };
        byName[s.name].events++;
        byName[s.name].wins += s.wins;
        byName[s.name].losses += s.losses;
      });
    });
    var rows = Object.keys(byName).map(function (k) { return byName[k]; });
    rows.sort(function (x, y) { return y.wins - x.wins || x.name.localeCompare(y.name, "ja"); });
    return rows;
  }

  /* ============ Leg helpers ============ */
  function legLabel(leg) {
    return leg.type === "cricket" ? "クリケット" : String(leg.target);
  }
  function legSummary(legs) {
    return legs.map(function (leg, i) { return (i + 1) + "Leg " + legLabel(leg); }).join(" ・ ");
  }
  function legOptionsHtml(index, selected) {
    var html = "";
    LEG_TARGETS.forEach(function (t) {
      var val = "01-" + t;
      html += '<option value="' + val + '"' + (selected.type === "01" && selected.target === t ? " selected" : "") + ">" + t + "(01)</option>";
    });
    if (index > 0) {
      html += '<option value="cricket"' + (selected.type === "cricket" ? " selected" : "") + ">クリケット</option>";
    }
    return html;
  }
  function parseLegValue(v) {
    if (v === "cricket") return { type: "cricket" };
    var target = parseInt(v.split("-")[1], 10);
    return { type: "01", target: target };
  }
  function defaultLegs(count) {
    var legs = [];
    for (var i = 0; i < count; i++) legs.push({ type: "01", target: 501 });
    return legs;
  }
  function requiredLegWins(legs) {
    var n = legs && legs.length ? legs.length : 1;
    return Math.ceil(n / 2);
  }

  /* ============ Escaping ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============ Ephemeral UI state (not persisted to the artifact, but
     mirrored to sessionStorage — see saveUiSnapshot/loadUiSnapshot below).
     Mobile browsers frequently reload a backgrounded tab (e.g. when the
     on-screen keyboard opens), which wipes plain JS variables; without this
     mirror that reload silently dumps the user back to the table list mid
     form-fill, which looks like "the screen goes back" while typing. ============ */
  var UI_STORAGE_KEY = "dartsnight_ui_v1";
  var ui = {
    topTab: "tables",       // "tables" | "history"
    activeTableId: null,
    tab: "matches",         // sub-tab within a table: "matches" | "standings"
    openMatchId: null,
    draftScores: {},        // matchId -> {a, b}
    draftBoard: {},         // matchId -> board number
    showPasswordPrompt: false,
    passwordError: false,
    showNewTableForm: false,
    newTable: { format: "singles", name: "", entrants: [], entrantDraft: [], ratingDraft: "", legCount: 3, legs: defaultLegs(3), boards: 1 },
    editingLegsTableId: null,
    editLegs: null,         // draft legs array while editing an existing table's leg config
    pendingConfirm: null,   // null | {type:"finish"|"cancel", tableId} | {type:"finish-tournament"|"cancel-tournament"}
    confirmDeleteId: null,
    tournamentSetup: { advanceCount: 2, selectedIds: [], mode: "auto", manualPositions: {} },
    showTableCountPicker: false, // "ロビン表をいくつ作りますか？" step, shown before the entrant form
    tableCountDraft: 2,
    tableWizard: null       // null | {remaining, total} while guiding through creating several robins in a row
  };

  function saveUiSnapshot() {
    try {
      sessionStorage.setItem(UI_STORAGE_KEY, JSON.stringify({
        topTab: ui.topTab,
        activeTableId: ui.activeTableId,
        tab: ui.tab,
        showNewTableForm: ui.showNewTableForm,
        newTable: ui.newTable,
        showTableCountPicker: ui.showTableCountPicker,
        tableCountDraft: ui.tableCountDraft,
        tableWizard: ui.tableWizard,
        editingLegsTableId: ui.editingLegsTableId,
        editLegs: ui.editLegs,
        tournamentSetup: ui.tournamentSetup,
        // The open match editor (対戦結果の入力) is exactly the screen a user
        // is mid-tap on when a silent reload hits — losing it not only drops
        // the score they were entering but also swaps in the finish/cancel
        // buttons in that same screen spot, risking an accidental tap on a
        // destructive action. Persist it too.
        openMatchId: ui.openMatchId,
        openMatchDraft: ui.openMatchId ? {
          score: ui.draftScores[ui.openMatchId] || null,
          board: ui.draftBoard[ui.openMatchId] != null ? ui.draftBoard[ui.openMatchId] : null
        } : null
      }));
    } catch (e) {}
  }

  function loadUiSnapshot() {
    try {
      var raw = sessionStorage.getItem(UI_STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== "object") return;
      if (saved.topTab === "tables" || saved.topTab === "history" || saved.topTab === "tournament") ui.topTab = saved.topTab;
      if (typeof saved.activeTableId === "string" || saved.activeTableId === null) ui.activeTableId = saved.activeTableId;
      if (saved.tab === "matches" || saved.tab === "standings") ui.tab = saved.tab;
      if (typeof saved.showNewTableForm === "boolean") ui.showNewTableForm = saved.showNewTableForm;
      if (typeof saved.showTableCountPicker === "boolean") ui.showTableCountPicker = saved.showTableCountPicker;
      if (typeof saved.tableCountDraft === "number") ui.tableCountDraft = saved.tableCountDraft;
      if (saved.tableWizard && typeof saved.tableWizard === "object" &&
          typeof saved.tableWizard.remaining === "number" && typeof saved.tableWizard.total === "number") {
        ui.tableWizard = { remaining: saved.tableWizard.remaining, total: saved.tableWizard.total };
      }
      if (saved.newTable && typeof saved.newTable === "object") {
        ui.newTable = {
          format: saved.newTable.format || "singles",
          name: saved.newTable.name || "",
          entrants: Array.isArray(saved.newTable.entrants) ? saved.newTable.entrants : [],
          entrantDraft: Array.isArray(saved.newTable.entrantDraft) ? saved.newTable.entrantDraft : [],
          ratingDraft: typeof saved.newTable.ratingDraft === "string" ? saved.newTable.ratingDraft : "",
          legCount: saved.newTable.legCount || 3,
          legs: Array.isArray(saved.newTable.legs) ? saved.newTable.legs : defaultLegs(3),
          boards: saved.newTable.boards || 1
        };
      }
      if (typeof saved.editingLegsTableId === "string" || saved.editingLegsTableId === null) ui.editingLegsTableId = saved.editingLegsTableId;
      if (Array.isArray(saved.editLegs)) ui.editLegs = saved.editLegs;
      if (saved.tournamentSetup && typeof saved.tournamentSetup === "object") {
        ui.tournamentSetup = {
          advanceCount: typeof saved.tournamentSetup.advanceCount === "number" ? saved.tournamentSetup.advanceCount : 2,
          selectedIds: Array.isArray(saved.tournamentSetup.selectedIds) ? saved.tournamentSetup.selectedIds : [],
          mode: saved.tournamentSetup.mode === "manual" ? "manual" : "auto",
          manualPositions: saved.tournamentSetup.manualPositions && typeof saved.tournamentSetup.manualPositions === "object" ? saved.tournamentSetup.manualPositions : {}
        };
      }
      if (typeof saved.openMatchId === "string") {
        ui.openMatchId = saved.openMatchId;
        var d = saved.openMatchDraft;
        if (d && typeof d === "object") {
          if (d.score && typeof d.score === "object") {
            ui.draftScores[ui.openMatchId] = { a: d.score.a || 0, b: d.score.b || 0 };
          }
          if (typeof d.board === "number") ui.draftBoard[ui.openMatchId] = d.board;
        }
      }
    } catch (e) {}
  }
  loadUiSnapshot();

  /* ============ Toasts ============ */
  function toast(msg) {
    var wrap = document.getElementById("toast-wrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity 0.4s ease";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 420);
    }, 3200);
  }

  /* ============ Rendering: shared bits ============ */
  function boardStrip(t) {
    if (t.boardCount <= 1) return "";
    var chips = [];
    for (var b = 1; b <= t.boardCount; b++) {
      var busy = t.matches.find(function (m) { return m.status === "in_progress" && m.board === b; });
      if (busy) {
        chips.push('<div class="board-chip busy"><span class="label">ボード ' + b + '</span>' + esc(busy.playerAName) + " vs " + esc(busy.playerBName) + "</div>");
      } else {
        chips.push('<div class="board-chip free"><span class="label">ボード ' + b + "</span>空き</div>");
      }
    }
    return '<div class="board-strip">' + chips.join("") + "</div>";
  }

  function statusLabel(s) {

  function matchCard(t, m, editable) {
    var aWin = m.status === "done" && m.scoreA > m.scoreB;
    var bWin = m.status === "done" && m.scoreB > m.scoreA;

      html += '<div class="match-score mono">' + m.scoreA + " – " + m.scoreB + (editable ? ' &nbsp;·&nbsp; <button class="btn btn-ghost btn-sm" data-action="reopen-match" data-id="' + m.id + '">編集</button>' : "") + "</div>";
    } else if (editable) {

        var canConfirm = ds.a !== ds.b && Math.max(ds.a, ds.b) >= needed;

          html += '<div class="score-row"><span class="name">' + esc(m.playerBName) + '</span><div class="stepper"><button data-action="score-dec" data-id="' + m.id + '" data-side="b" aria-label="減らす">−</button><output class="mono">' + ds.b + '</output><button data-action="score-inc" data-id="' + m.id + '" data-side="b" aria-label="増やす">+</button></div></div>';

  function crossTable(t, editable) {
    var entrants = t.entrants;
    var n = entrants.length;
    if (n < 2) return "";
    var idIndex = {};
    entrants.forEach(function (p, i) { idIndex[p.id] = i; });
    var pairMatch = {};
    t.matches.forEach(function (m) {
      var ia = idIndex[m.playerAId], ib = idIndex[m.playerBId];
      if (ia == null || ib == null) return;
      var key = ia < ib ? ia + "-" + ib : ib + "-" + ia;
      pairMatch[key] = m;
    });
    var standingsRows = computeStandings(entrants, t.matches);
    var standById = {};
    standingsRows.forEach(function (r, i) { standById[r.id] = { rank: i + 1, row: r }; });

    var html = '<div class="ct-wrap">';
    html += '<div class="ct-header"><div class="ct-header-bar" aria-hidden="true"></div><h3 class="ct-title">' + esc(t.name) + "</h3></div>";
    html += '<div class="table-scroll"><table class="ct-table"><thead><tr><th class="ct-corner"></th>';
    for (var c = 0; c < n; c++) html += '<th class="ct-colnum mono">' + (c + 1) + "</th>";
    html += '<th class="ct-stat-h">勝ち数</th><th class="ct-stat-h">勝ちLEG数</th><th class="ct-stat-h">負けLEG数</th><th class="ct-stat-h">得失LEG数</th><th class="ct-stat-h">順位</th></tr></thead><tbody>';

    for (var r = 0; r < n; r++) {
      var pr = entrants[r];
      html += '<tr><th class="ct-rowlabel"><span class="ct-rownum mono">' + (r + 1) + '</span><span class="ct-rowname">' + esc(pr.name) + "</span>" + ratingBadgeHtml(pr.rating) + "</th>";
      for (var c2 = 0; c2 < n; c2++) {
        if (r === c2) { html += '<td class="ct-cell diag"></td>'; continue; }
        var pairKey = r < c2 ? r + "-" + c2 : c2 + "-" + r;
        var m = pairMatch[pairKey];
        if (!m) { html += '<td class="ct-cell hatched"' + (r > c2 ? ' aria-hidden="true"' : "") + '></td>'; continue; }
        var isDone = m.status === "done";
        var scoreRow, scoreCol;
        if (idIndex[m.playerAId] === r) { scoreRow = m.scoreA; scoreCol = m.scoreB; }
        else { scoreRow = m.scoreB; scoreCol = m.scoreA; }
        var text = isDone ? (scoreRow + " - " + scoreCol) : "　-　";
        var mark = isDone ? resultMarkHtml(scoreRow > scoreCol) : "";
        var cls = "ct-cell fillable" + (isDone ? " done" : m.status === "in_progress" ? " live" : "") + (r > c2 ? " ct-mirror" : "");
        if (editable) {
          var act = isDone ? "reopen-match" : "open-match";
          html += '<td class="' + cls + '"><button class="ct-cell-btn mono" data-action="' + act + '" data-id="' + m.id + '">' + mark + "(" + text + ")</button></td>";
        } else {
          html += '<td class="' + cls + '"><span class="mono">' + mark + "(" + text + ")</span></td>";
        }
      }
      var st = standById[pr.id];
      var legsFor = st ? st.row.legsFor : 0;
      var legsAgainst = st ? st.row.legsAgainst : 0;
      var diff = legsFor - legsAgainst;
      html += '<td class="ct-stat mono">' + (st ? st.row.wins : 0) + '</td><td class="ct-stat mono">' + legsFor + '</td><td class="ct-stat mono">' + legsAgainst + '</td><td class="ct-stat mono">' + (diff > 0 ? "+" : "") + diff + '</td><td class="ct-stat mono ct-rank">' + (st ? st.rank : "") + "</td>";
      html += "</tr>";
    }
    html += "</tbody></table></div>";

    var ordered = t.matches.slice().sort(function (a, b) { return a.order - b.order; });
    html += '<div class="ct-legend"><span class="ct-legend-tag">試合順</span><div class="ct-legend-list">';
    html += ordered.map(function (m, i) {
      var ia = idIndex[m.playerAId], ib = idIndex[m.playerBId];
      return '<span class="ct-legend-item">第' + (i + 1) + "試合：<b>" + (ia + 1) + "-" + (ib + 1) + "</b></span>";
    }).join("");
    html += "</div></div>";

    html += "</div>";
    return html;
  }

      lifetime.forEach(function (r) {

        html += "<tr><td>" + esc(r.name) + '</td><td class="num tabular">' + r.events + '</td><td class="num tabular">' + r.wins + '</td><td class="num tabular">' + r.losses + '</td><td class="num tabular">' + rate + "</td></tr>";

  /* ============ Rendering: tournament bracket ============ */
  function bracketSeedTagHtml(source) {
    return source ? ' <span class="trn-seed-tag">' + esc(source.tableName) + " " + source.rank + "位</span>" : "";
  }

  function bracketDiagramTeamBoxHtml(name, isWinner, isPending) {
    if (isPending) return '<div class="bracket-team-box pending">未定</div>';
    return '<div class="bracket-team-box' + (isWinner ? " winner" : "") + '">' + esc(name) + "</div>";
  }

  function renderBracketDiagram(b) {
    // CSS Grid layout (not nested flex + align-items:stretch): each round's
    // column is a fixed grid-template-columns track, and each round r match
    // at index i explicitly spans grid rows [2 + i*2^r, 2 + (i+1)*2^r) out of
    // leafCount base row-tracks (row 1 is reserved for the round-title row).
    // This "row-span doubling" makes every match's box land exactly centered
    // over the two earlier-round matches that feed it, without depending on
    // any browser resolving a multi-level flex height-stretch chain -- that
    // chain rendered fine in desktop-browser testing but collapsed to
    // invisible on at least one real mobile browser, so it's avoided here.
    var totalRounds = b.rounds.length;
    var leafCount = b.rounds[0].length;
    // Explicit min-width/min-height (computed from the same track sizes used
    // below) as a hard floor: even if CSS Grid track sizing were to somehow
    // fail to apply on a particular engine, the wrapper still reserves real
    // visible space instead of collapsing to 0x0 and disappearing entirely.
    var diagramMinWidth = totalRounds * 118 + 110 + totalRounds * 20;
    var diagramMinHeight = 24 + leafCount * 56;
    var html = '<div class="bracket-diagram-wrap"><div class="bracket-diagram" style="min-width:' + diagramMinWidth + 'px; min-height:' + diagramMinHeight + 'px; grid-template-columns: repeat(' + totalRounds + ', 118px) 110px; grid-template-rows: auto repeat(' + leafCount + ', 56px);">';
    for (var r = 0; r < totalRounds; r++) {
      var isFinal = r === totalRounds - 1;
      var span = Math.pow(2, r);
      html += '<div class="bracket-round-title" style="grid-column:' + (r + 1) + ';">' + roundLabel(totalRounds, r) + "</div>";
      b.rounds[r].forEach(function (m, i) {
        var rowStart = 2 + i * span;
        var rowEnd = rowStart + span;
        var connCls = isFinal ? " conn-final" : (i % 2 === 0 ? " conn-top" : " conn-bottom");
        html += '<div class="bracket-match-slot' + connCls + '" style="grid-column:' + (r + 1) + "; grid-row:" + rowStart + " / " + rowEnd + ';">';
        if (m.bye) {
          html += bracketDiagramTeamBoxHtml(m.winnerName, true, false);
          html += '<div class="bracket-team-box pending">(不戦勝)</div>';
        } else {
          html += m.playerAId ? bracketDiagramTeamBoxHtml(m.playerAName, m.status === "done" && m.winnerId === m.playerAId, false) : bracketDiagramTeamBoxHtml(null, false, true);
          html += m.playerBId ? bracketDiagramTeamBoxHtml(m.playerBName, m.status === "done" && m.winnerId === m.playerBId, false) : bracketDiagramTeamBoxHtml(null, false, true);
        }
        html += "</div>";
      });
    }
    var finalRound = b.rounds[totalRounds - 1];
    var champion = finalRound[0] && finalRound[0].status === "done" ? finalRound[0].winnerName : null;
    html += '<div class="bracket-round-title" style="grid-column:' + (totalRounds + 1) + ';">優勝</div>';
    html += '<div class="bracket-champion-col" style="grid-column:' + (totalRounds + 1) + "; grid-row: 2 / " + (2 + leafCount) + ';"><div class="bracket-champion-box' + (champion ? "" : " pending") + '">' + (champion ? "🏆 " + esc(champion) : "?") + "</div></div>";
    html += "</div></div>";
    return html;
  }

  function bracketMatchCard(m, editable, legs) {

        html += '<div class="score-row"><span class="name">' + esc(m.playerBName) + '</span><div class="stepper"><button data-action="score-dec" data-id="' + m.id + '" data-side="b" aria-label="減らす">−</button><output class="mono">' + ds.b + '</output><button data-action="score-inc" data-id="' + m.id + '" data-side="b" aria-label="増やす">+</button></div></div>';
        html += "</div>";
        html += '<div class="match-actions"><button class="btn btn-primary btn-sm" data-action="confirm-bracket-match" data-id="' + m.id + '"' + (canConfirmB ? "" : " disabled") + '>結果を確定</button> <button class="btn btn-ghost btn-sm" data-action="close-bracket-match">閉じる</button></div>';
        if (!canConfirmB && ds.a !== ds.b) {
          html += '<p class="muted" style="margin:6px 0 0;font-size:12px;">先に' + neededB + 'レグ取ると確定できます</p>';
        }
        html += "</div>";
      }
    }
    html += "</div>";

      return html;
    }
    if (finished.length < 2) {
      html += '<div class="card"><div class="empty-state"><div class="icon">🏆</div><p>トーナメント表を作るには、2つ以上のロビン表が終了している必要があります。</p></div></div>';
      return html;
    }
    html += '<div class="card"><h2 style="margin-top:0;">トーナメント表をつくる</h2><div class="stack">';
    html += '<div class="field"><label>対象にするロビン表 (2つ以上選択)</label><div class="trn-source-list">';
    finished.forEach(function (t) {
      var checked = ts.selectedIds.indexOf(t.id) !== -1;
      var d = new Date(t.finishedAt);
      var dateStr = isNaN(d.getTime()) ? "" : (d.getMonth() + 1) + "/" + d.getDate();
      html += '<button type="button" class="trn-source-row' + (checked ? " checked" : "") + '" data-action="toggle-tournament-source" data-id="' + t.id + '">';
      html += '<span class="trn-source-check">' + (checked ? "☑" : "☐") + "</span>";
      html += '<span class="trn-source-info"><b>' + esc(t.name) + '</b><span class="muted mono"> ' + dateStr + " ・ " + esc(FORMAT_LABEL[t.format] || "シングルス") + " ・ " + (t.finalStandings || []).length + "エントリー</span></span>";
      html += "</button>";
    });
    html += "</div></div>";
    html += '<div class="field"><label>各ロビンから上位何チーム進出</label><div class="stepper"><button data-action="tournament-advance-dec">−</button><output class="mono">' + ts.advanceCount + '位まで</output><button data-action="tournament-advance-inc">+</button></div></div>';
    var selectedEntries = finished.filter(function (t) { return ts.selectedIds.indexOf(t.id) !== -1; });
    var seeds = selectedEntries.length >= 2 ? buildBracketSeeds(selectedEntries, ts.advanceCount) : [];
    var totalSeeds = seeds.length;
    html += '<p class="muted">' + (selectedEntries.length >= 2 ? "合計 " + totalSeeds + " チームが進出します" : "ロビン表を2つ以上選んでください") + "</p>";
    var canCreate = selectedEntries.length >= 2 && totalSeeds >= 2;

    if (canCreate) {
      html += '<div class="field"><label>トーナメント表への配置</label><div class="seg" role="group" aria-label="配置方法">';
      html += '<button data-action="set-tournament-mode" data-mode="auto" aria-pressed="' + (ts.mode !== "manual") + '">自動配置（成績順に対極）</button>';
      html += '<button data-action="set-tournament-mode" data-mode="manual" aria-pressed="' + (ts.mode === "manual") + '">手動配置</button>';
      html += "</div></div>";

      if (ts.mode === "manual") {
        var size = nextPow2(totalSeeds);
        var used = {};
        seeds.forEach(function (s) {
          var p = ts.manualPositions[s.id];
          if (p) used[p] = (used[p] || 0) + 1;
        });
        html += '<div class="field"><label>勝ち上がったチームに配置番号を割り振ってください(1〜' + size + ")</label><div class=\"trn-manual-list\">";
        seeds.forEach(function (s) {
          var p = ts.manualPositions[s.id] || "";
          var dup = p && used[p] > 1;
          html += '<div class="trn-manual-row' + (dup ? " dup" : "") + '">';
          html += '<span class="trn-manual-name">' + esc(s.name) + '<span class="muted mono">' + esc(s.source.tableName) + " " + s.source.rank + "位</span></span>";
          html += '<select class="trn-manual-select" data-action="set-manual-position" data-key="' + esc(s.id) + '"><option value="">-</option>';
          for (var n = 1; n <= size; n++) {
            html += '<option value="' + n + '"' + (String(p) === String(n) ? " selected" : "") + '>' + n + "</option>";
          }
          html += "</select></div>";
        });
        html += "</div></div>";
        var assignedCount = seeds.filter(function (s) { return !!ts.manualPositions[s.id]; }).length;
        var hasDup = Object.keys(used).some(function (k) { return used[k] > 1; });
        if (hasDup) html += '<p class="muted" style="color:var(--red);">同じ配置番号が重複しています</p>';
        else if (assignedCount < totalSeeds) html += '<p class="muted">全チームに配置番号を割り振ってください（あと' + (totalSeeds - assignedCount) + "）</p>";
        else html += '<p class="muted">配置完了です</p>';
        canCreate = canCreate && assignedCount === totalSeeds && !hasDup;
      } else {
        html += '<p class="muted">成績上位のチームが対極に配置され、決勝まで当たらないよう自動で組まれます</p>';
      }
    }

    html += '<button class="btn btn-primary btn-block" data-action="create-tournament"' + (canCreate ? "" : " disabled") + ">トーナメント表を作成</button>";
    html += "</div></div>";
    return html;
  }

  function letterName(n) {
    // 0 -> A, 1 -> B, ... 25 -> Z, 26 -> AA, 27 -> AB, ... (Excel-style)
    var s = "";
    n = n + 1;
    while (n > 0) {
      var rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  /* ============ Document snapshot for republish ============ */
  function buildFullDocument(newState) {
    var scriptTag = document.getElementById("app-script").outerHTML;
    var appShell =
      '<div id="app">' +
        '<header class="header"><div class="header-inner">' +
          '<div class="brand"><div class="brand-icon" aria-hidden="true"></div>' +
          '<div class="brand-text"><h1>トーナメント</h1><p>ラウンドロビン式ハウストーナメント盤</p></div></div>' +
          '<div class="role-toggle" id="role-toggle" role="group" aria-label="表示モード"></div>' +
        '</div></header>' +
        '<div id="readonly-banner"></div>' +
        '<main class="container" id="root"></main>' +
      '</div>';
    // Bare fragment: title + font link + style, then body content, then the
    // state and app scripts — the same shape as the page's original source
    // file. No <!doctype>/<html>/<head>/<body> wrapper: the runtime supplies
    // that skeleton itself (and does so correctly), just like it does for a
    // fresh publish of the source file.
    return HEAD_BLOCK + "\n" +
      appShell + "\n" +
      '<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>\n' +
      QR_LIB_BLOCK + "\n" +
      '<script type="application/json" id="state-data">' + JSON.stringify(newState).replace(/</g, "\\u003c") + "<\/script>\n" +
      scriptTag;
  }

  /* ============ Persistence ============ */
  // Writes go straight to Firestore. Every other open tab/phone is
  // subscribed to the same document (see the onSnapshot listener set up
  // in Init below), so as soon as this write lands, it is pushed live to
  // everyone -- no republish, no "shared version" pinning, no manual
  // refresh needed.
  var applyingRemote = false; // true while a remote snapshot is being applied
  // Tracks the payload string of our own most recent write, so the
  // onSnapshot listener below can recognize when a snapshot is nothing but
  // Firestore echoing our own write back to us and skip re-rendering for it.
  // Without this, that echo (which arrives a moment after the local write,
  // once the server confirms it) would trigger a second full-DOM render,
  // which can wipe out text the user has since started typing into another
  // field that hasn't been committed (blurred) yet.
  var lastKnownPayload = null;
  function persist(newState) {
    var prevState = state;
    state = newState;
    render();
    if (!dbReady || applyingRemote) { return; }
    var payload;
    try {
      // Firestore documents can't hold arrays nested directly inside other
      // arrays (this app's bracket.rounds is exactly that shape), so the
      // whole state is stored as one JSON string field instead of native
      // Firestore fields. This also sidesteps every other Firestore type
      // restriction (Firestore's `undefined` cannot be stored either -
      // JSON.stringify has always silently dropped it here, since this is
      // the same round-trip the app used when it republished itself as
      // one HTML file).
      payload = JSON.stringify(newState);
    } catch (e) {
      toast("保存に失敗しました（データ形式エラー）");
      return;
    }
    lastKnownPayload = payload;
    stateDocRef.set({ payload: payload, updatedAt: Date.now() }).then(function () {
      writeChecked = true;
      canWrite = true;
    }).catch(function (err) {
      writeChecked = true;
      console.error("Firestore write failed", err);
      // The write never reached the server, so the payload we optimistically
      // remembered above is wrong -- clear it so the next real snapshot from
      // the server (reflecting the true, unrolled-back state) isn't mistaken
      // for a self-echo and skipped.
      lastKnownPayload = null;
      if (err && err.code === "permission-denied") {
        canWrite = false;
        state = prevState;
        render();
        toast("閲覧専用のため保存できませんでした");
      } else {
        state = prevState;
        render();
        toast("保存に失敗しました。もう一度お試しください");
      }
    });
  }

  /* ============ Actions ============ */
  function cloneState() {
    return JSON.parse(JSON.stringify(state));
  }

  function resetNewTableDraft() {
    ui.newTable = { format: "singles", name: "", entrants: [], entrantDraft: [], ratingDraft: "", legCount: 3, legs: defaultLegs(3), boards: 1 };
  }

  function handleAction(action, target) {
    var id = target.getAttribute("data-id");

    if (action === "mode-auto") {
      if (isSharedEntry) return; // shared/QR visitors can never enter 操作する
      if (unlocked) {
        viewMode = "auto";
        try { localStorage.setItem("dartsnight_viewmode", "auto"); } catch (e) {}
        render();
      } else {
        ui.showPasswordPrompt = true;
        ui.passwordError = false;
        render();
        var pwFocus = document.getElementById("password-input");
        if (pwFocus) pwFocus.focus();
      }
      return;
    }
    if (action === "mode-view") {
      viewMode = "view";
      try { localStorage.setItem("dartsnight_viewmode", "view"); } catch (e) {}
      ui.showPasswordPrompt = false;
      ui.passwordError = false;
      render();
      return;
    }
    if (action === "copy-share-url") {
      var doCopyToast = function (ok) { toast(ok ? "リンクをコピーしました" : "コピーできませんでした。URLを長押しして手動でコピーしてください"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(SHARE_URL).then(function () { doCopyToast(true); }, function () { doCopyToast(false); });
      } else {
        try {
          var ta = document.createElement("textarea");
          ta.value = SHARE_URL;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          doCopyToast(ok);
        } catch (e) {
          doCopyToast(false);
        }
      }
      return;
    }
    if (action === "new-tournament-room") {
      if (isSharedEntry) return; // defense in depth; the link is hidden for shared entries anyway
      var okNewRoom = window.confirm("今の大会とは別の、新しい大会を始めます。\n新しいURLに移動しますが、よろしいですか？\n（今の大会のURLは、このまま使えばいつでも戻れます）");
      if (!okNewRoom) return;
      window.location.href = BASE_URL + "?" + ROOM_PARAM + "=" + uid("t");
      return;
    }
    if (action === "cancel-password") { ui.showPasswordPrompt = false; ui.passwordError = false; render(); return; }
    if (action === "submit-password") {
      if (isSharedEntry) return; // shared/QR visitors can never unlock 操作する
      var pwEl = document.getElementById("password-input");
      var pwVal = (pwEl && pwEl.value) || "";
      if (pwVal === EDIT_PASSWORD) {
        unlocked = true;
        try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
        viewMode = "auto";
        try { localStorage.setItem("dartsnight_viewmode", "auto"); } catch (e) {}
        ui.showPasswordPrompt = false;
        ui.passwordError = false;
        render();
        toast("操作モードを解除しました");
      } else {
        ui.passwordError = true;
        render();
        var pwEl2 = document.getElementById("password-input");
        if (pwEl2) { pwEl2.focus(); pwEl2.select(); }
      }
      return;
    }
    if (action === "set-top-tab") { ui.topTab = target.getAttribute("data-tab"); render(); return; }
    if (action === "set-tab") { ui.tab = target.getAttribute("data-tab"); ui.openMatchId = null; render(); return; }
    if (action === "back-to-list") { ui.activeTableId = null; ui.openMatchId = null; render(); return; }
    if (action === "open-table") { ui.activeTableId = id; ui.tab = "matches"; ui.openMatchId = null; render(); return; }

    /* ---- new table setup ---- */
    if (action === "show-table-count-picker") { ui.showTableCountPicker = true; ui.tableCountDraft = ui.tableCountDraft || 2; render(); return; }
    if (action === "cancel-table-count-picker") { ui.showTableCountPicker = false; render(); return; }
    if (action === "table-count-inc") { ui.tableCountDraft = Math.min(12, (ui.tableCountDraft || 2) + 1); render(); return; }
    if (action === "table-count-dec") { ui.tableCountDraft = Math.max(1, (ui.tableCountDraft || 2) - 1); render(); return; }
    if (action === "start-table-wizard") {
      var wCount = ui.tableCountDraft || 1;

      var rating = Number(ratingRaw);
      if (!isFinite(rating)) {

      ui.newTable.entrants.push({ id: uid("p"), name: label, members: members, rating: rating });

      for (var j = 0; j < size; j++) {

      var m3 = t3.matches.find(function (m) { return m.id === id; });

    if (action === "revert-match") {
      if (!activeTable) return;
      var ns4 = cloneState();
      var t4 = ns4.tables.find(function (x) { return x.id === ui.activeTableId; });
      var m4 = t4.matches.find(function (m) { return m.id === id; });
      m4.status = "pending"; m4.scoreA = 0; m4.scoreB = 0; m4.winnerId = null;

      persist(ns4);

    if (action === "score-inc" || action === "score-dec") {
      var side = target.getAttribute("data-side");
      var ds = ui.draftScores[id] || { a: 0, b: 0 };

    if (action === "confirm-match") {

      var ds2 = ui.draftScores[id];
      if (!ds2 || ds2.a === ds2.b) return;
      if (Math.max(ds2.a, ds2.b) < requiredLegWins(activeTable.legs)) return;
      var ns5 = cloneState();
      var t5 = ns5.tables.find(function (x) { return x.id === ui.activeTableId; });
      var m5 = t5.matches.find(function (m) { return m.id === id; });
      m5.status = "done";
      m5.scoreA = ds2.a; m5.scoreB = ds2.b;
      m5.winnerId = ds2.a > ds2.b ? m5.playerAId : m5.playerBId;

      persist(ns5);

    if (action === "finish-table") { ui.pendingConfirm = { type: "finish", tableId: id }; render(); return; }

      var ns6 = cloneState();

      var standings = computeStandings(t6.entrants, t6.matches);
      var historyEntry = {
        id: t6.id,
        name: t6.name,
        format: t6.format,
        legs: t6.legs,
        finishedAt: nowIso(),
        players: t6.entrants,
        finalStandings: standings.map(function (r) { return { name: r.name, rating: r.rating, wins: r.wins, losses: r.losses, played: r.played }; })
      };
      ns6.history = [historyEntry].concat(ns6.history).slice(0, HISTORY_LIMIT);
      ns6.tables = ns6.tables.filter(function (x) { return x.id !== id; });
      ui.activeTableId = null;
      persist(ns6);
      return;
    }
    if (action === "confirm-cancel-table") {
      ui.pendingConfirm = null;
      var ns7 = cloneState();
      ns7.tables = ns7.tables.filter(function (x) { return x.id !== id; });
      ui.activeTableId = null;
      persist(ns7);
      return;
    }
    if (action === "delete-history") { ui.confirmDeleteId = id; render(); return; }
    if (action === "confirm-delete-history") {
      ui.confirmDeleteId = null;
      var ns8 = cloneState();
      ns8.history = ns8.history.filter(function (h) { return h.id !== id; });

      return;

    /* ---- tournament bracket setup ---- */
    if (action === "toggle-tournament-source") {

      return;

    if (action === "tournament-advance-inc" || action === "tournament-advance-dec") {
      var deltaT = action === "tournament-advance-inc" ? 1 : -1;
      ui.tournamentSetup.advanceCount = Math.max(1, Math.min(8, ui.tournamentSetup.advanceCount + deltaT));
      render();
      return;
    }
    if (action === "set-tournament-mode") {
      var newMode = target.getAttribute("data-mode") === "manual" ? "manual" : "auto";
      ui.tournamentSetup.mode = newMode;
      render();
      return;
