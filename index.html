    if (action === "set-manual-position") {
      var key = target.getAttribute("data-key");
      var val = target.value;
      if (val) ui.tournamentSetup.manualPositions[key] = parseInt(val, 10);
      else delete ui.tournamentSetup.manualPositions[key];
      render();

    }
    if (action === "create-tournament") {
      var selEntries = state.history.filter(function (t) { return ui.tournamentSetup.selectedIds.indexOf(t.id) !== -1; });
      if (selEntries.length < 2) return;
      var seeds = buildBracketSeeds(selEntries, ui.tournamentSetup.advanceCount);
      if (seeds.length < 2) { toast("進出できるチームが足りません"); return; }
      var rounds;
      if (ui.tournamentSetup.mode === "manual") {
        var mSize = nextPow2(seeds.length);
        var positions = ui.tournamentSetup.manualPositions;
        var assigned = seeds.filter(function (s) { return !!positions[s.id]; });
        var usedPos = {};
        var dupFound = false;
        assigned.forEach(function (s) {
          var p = positions[s.id];
          if (usedPos[p]) dupFound = true;
          usedPos[p] = true;
        });
        if (assigned.length < seeds.length || dupFound) { toast("全チームに、重複しない配置番号を割り振ってください"); return; }
        rounds = buildBracketRoundsFromSlots(buildManualSlots(seeds, positions, mSize));

        createdAt: nowIso()

      var nsT = cloneState();
      nsT.bracket = newBracket;

      persist(nsT);

    /* ---- tournament bracket matches ---- */

    if (action === "reopen-bracket-match") {
      if (!state.bracket) return;
      var nsR = cloneState();

      var mR = nsR.bracket.rounds[locR.round][locR.index];

    if (action === "finish-tournament") { ui.pendingConfirm = { type: "finish-tournament" }; render(); return; }
    if (action === "cancel-tournament") { ui.pendingConfirm = { type: "cancel-tournament" }; render(); return; }

      var finalR = bF.rounds[bF.rounds.length - 1];

      var historyEntry2 = {
        id: bF.id,
        name: bF.name,
        advanceCount: bF.advanceCount,
        sourceNames: bF.sourceNames,
        legs: bF.legs,
        rounds: bF.rounds,

        finishedAt: nowIso()

      nsF.bracket = null;
      persist(nsF);
      return;
    }
    if (action === "confirm-cancel-tournament") {
      ui.pendingConfirm = null;
      var nsC = cloneState();
      nsC.bracket = null;
      persist(nsC);

    }

  document.getElementById("app").addEventListener("click", function (e) {
    var target = e.target.closest("[data-action]");
    if (!target) return;
    // A <select> already fires its data-action handler on "change" (below),
    // with the actually-chosen value. Native <select> elements also emit a
    // "click" event the instant they're clicked to OPEN the dropdown --
    // before any option is picked -- so handling that here too would call
    // handleAction() with the stale old value. For most select handlers
    // that's harmless (they just re-store the same value), but any handler
    // that calls render() would replace this DOM node while the browser's
    // native option popup is still open, force-closing it before the user
    // can choose anything (this is exactly what made the manual-placement
    // dropdown snap shut instantly). So selects are excluded here entirely.
    if (target.tagName === "SELECT") return;
    handleAction(target.getAttribute("data-action"), target);
  });
  document.getElementById("app").addEventListener("change", function (e) {
    var target = e.target.closest("[data-action]");
    if (!target) return;
    if (target.tagName === "SELECT" || target.getAttribute("data-action") === "set-handicap") handleAction(target.getAttribute("data-action"), target);
  });
  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id && e.target.id.indexOf("entrant-member-") === 0) {
      e.preventDefault();
      handleAction("add-entrant", e.target);
    }
    if (e.key === "Enter" && e.target && e.target.id === "password-input") {
      e.preventDefault();
      handleAction("submit-password", e.target);
    }
  });
  // Mirror not-yet-submitted text into ui.newTable so a stray mobile reload

  document.getElementById("app").addEventListener("input", function (e) {

      ui.newTable.name = t.value;

      return;
    }
    if (t.id === "entrant-rating") {
      ui.newTable.ratingDraft = t.value;
      saveUiSnapshot();
      return;
    }
    var m = t.id && t.id.match(/^entrant-member-(\d+)$/);
    if (m) {
      var idx = parseInt(m[1], 10);
      ui.newTable.entrantDraft = ui.newTable.entrantDraft || [];
      ui.newTable.entrantDraft[idx] = t.value;
      saveUiSnapshot();
    }
  });

  /* ============ Init ============ */
  render(); // paint immediately from the seed embedded at build time

  if (dbReady) {
    stateDocRef.onSnapshot(function (snap) {
      if (!snap.exists) return;
      var data = snap.data();
      // Firestore echoes this tab's own writes back through the same
      // listener a moment later (once the server confirms them). If this
      // snapshot's payload is exactly what we just wrote ourselves, it
      // carries no new information -- skip it entirely rather than
      // re-rendering. A full re-render here would replace every input's DOM
      // node from `state`, which would silently erase any text the user has
      // since started typing into another field (e.g. a handicap value)
      // that hasn't been committed (blurred) yet, and would steal focus
      // away from it.
      if (data.payload === lastKnownPayload) { return; }
      var parsed;
      try {
        parsed = JSON.parse(data.payload);
      } catch (e) {
        console.error("Bad payload in Firestore doc", e);
        return;
      }
      try {
        applyingRemote = true;
        state = migrate(parsed);
        lastKnownPayload = data.payload;
        render();
      } finally {
        applyingRemote = false;
      }
    }, function (err) {
      console.error("Firestore sync error", err);
      toast("同期エラーが発生しました。電波状況をご確認ください");
    });
  }
})();
</script>
</body>
</html>
